name: Publish Docker image

# Pushes to main publish ghcr.io/<owner>/<repo>:latest (amd64 + arm64).
# Tag pushes (v*) additionally publish the semver tag and :latest.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -shuffle：测试套件曾经是顺序依赖的（包级 zenModels/
      # clineStreamLearned 被替换后不恢复），默认顺序永远绿、换序必红。
      # seed 必须写成 -shuffle=<n>：go 没有 -shuffle.seed 这个 flag，传了会让
      # test 二进制直接 "flag provided but not defined" 退出（2026-11-08 踩过）。
      # 固定 seed 让失败可复现。
      - name: Test (shuffled)
        run: go test ./... -count=1 -shuffle=1

      # -race：本仓库大量使用包级可变状态，而默认测试只覆盖串行路径。
      # Linux runner 有 cgo，可以跑；这是唯一能自动发现未加锁访问的关卡。
      - name: Test (race)
        run: go test ./... -count=1 -race

  docker:
    name: Docker image (amd64 + arm64)
    needs: vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
